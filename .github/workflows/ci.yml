name: CI

on:
  push:
    branches: [DEV]
  pull_request:
    branches: [DEV]

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      DATABASE_URL: ${{ matrix.app == 'api' && 'postgresql://ci:ci@localhost:5432/ci' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: matrix.app == 'api'
        run: npx prisma generate
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
